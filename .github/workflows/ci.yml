name: Solidity checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Install test dependency
        run: forge install foundry-rs/forge-std@16cb9c998736cab8f14aebd5199cdf6a02fde055 --no-commit
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test, fuzz and invariants
        run: forge test --show-progress -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Install test dependency
        run: forge install foundry-rs/forge-std@16cb9c998736cab8f14aebd5199cdf6a02fde055 --no-commit
      - name: Run Slither
        run: |
          set +e
          slither . --config-file slither.config.json --json slither-report.json
          status=$?
          # Slither returns 255 when findings are present. Findings are reviewed
          # and compared with the explicit baseline in the next step.
          if [ ! -f slither-report.json ]; then exit "$status"; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 255 ]; then exit "$status"; fi
      - name: Validate reviewed Slither baseline
        run: python scripts/check_slither_baseline.py slither-report.json docs/slither-baseline.json
      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither-report.json
          if-no-files-found: error
