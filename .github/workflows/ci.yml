name: Solidity checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - name: Install test dependency
        run: forge install foundry-rs/forge-std@16cb9c998736cab8f14aebd5199cdf6a02fde055 --no-commit
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test, fuzz and invariants
        run: forge test --show-progress -vvv

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.6
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - name: Install test dependency
        run: forge install foundry-rs/forge-std@16cb9c998736cab8f14aebd5199cdf6a02fde055 --no-commit
      - name: Run Slither
        run: |
          set +e
          slither . --config-file slither.config.json --json slither-report.json
          status=$?
          # Slither returns 255 when findings are present. Findings are reviewed
          # and compared with the explicit baseline in the next step.
          if [ ! -f slither-report.json ]; then exit "$status"; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 255 ]; then exit "$status"; fi
      - name: Validate reviewed Slither baseline
        run: python scripts/check_slither_baseline.py slither-report.json docs/slither-baseline.json
      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slither-report
          path: slither-report.json
          if-no-files-found: error
