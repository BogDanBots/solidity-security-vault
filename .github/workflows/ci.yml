name: Solidity checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install test dependency
        run: forge install foundry-rs/forge-std --no-commit
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test, fuzz and invariants
        run: forge test -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: pip install slither-analyzer
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install test dependency
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run Slither
        run: slither . --config-file slither.config.json
